    - name: /home/docker/matrix.{{inventory_hostname}}/synapse-purge.sh (safe Synapse cleanup)
      ansible.builtin.copy:
        src: files/synapse-purge.sh
        dest: /home/docker/matrix.{{inventory_hostname}}/synapse-purge.sh
        owner: root
        group: root
        mode: "0755"
        validate: /bin/bash -n %s
        backup: yes

    - name: /usr/local/sbin/fix-matrix-ignored-devices.sh (ignored-device watchdog)
      ansible.builtin.copy:
        src: files/fix-matrix-ignored-devices.sh
        dest: /usr/local/sbin/fix-matrix-ignored-devices.sh
        owner: root
        group: root
        mode: "0755"
        validate: /bin/bash -n %s
        backup: yes

    - name: /usr/local/sbin/matrix-device-health.sh (E2EE deleted-device watchdog)
      ansible.builtin.copy:
        src: files/matrix-device-health.sh
        dest: /usr/local/sbin/matrix-device-health.sh
        owner: root
        group: root
        mode: "0755"
        validate: /bin/bash -n %s
        backup: yes

    - name: Cron fix ignored matrix-commander devices daily
      ansible.builtin.cron:
        name: "Fix ignored matrix-commander devices"
        minute: "30"
        hour: "4"
        job: /usr/local/sbin/fix-matrix-ignored-devices.sh >>/home/docker/matrix.{{inventory_hostname}}/fix-ignored-devices.log 2>&1

    - name: Cron matrix-device-health daily (unmark stale deleted E2EE devices)
      ansible.builtin.cron:
        name: "Matrix device health"
        minute: "15"
        hour: "4"
        job: /usr/local/sbin/matrix-device-health.sh >>/home/docker/matrix.{{inventory_hostname}}/device-health.log 2>&1

    - name: Cron synapse-purge daily (safe vacuum/analyze)
      ansible.builtin.cron:
        name: "synapse-purge daily"
        minute: "30"
        hour: "3"
        job: /home/docker/matrix.{{inventory_hostname}}/synapse-purge.sh daily >/home/docker/matrix.{{inventory_hostname}}/purge.log 2>&1

    - name: Cron synapse-purge weekly (vacuum_full_tables, stops synapse briefly)
      ansible.builtin.cron:
        name: "synapse-purge weekly"
        weekday: "0"
        minute: "0"
        hour: "5"
        job: /home/docker/matrix.{{inventory_hostname}}/synapse-purge.sh weekly >/home/docker/matrix.{{inventory_hostname}}/purge.log 2>&1

    - name: Cron synapse-purge monthly (vacuum_full_state, longest downtime)
      ansible.builtin.cron:
        name: "synapse-purge monthly"
        day: "1"
        minute: "0"
        hour: "6"
        job: /home/docker/matrix.{{inventory_hostname}}/synapse-purge.sh monthly >/home/docker/matrix.{{inventory_hostname}}/purge.log 2>&1

  handlers:
    - name: run genpw.sh
      ansible.builtin.shell: ./genpw.sh
      args:
        chdir: /home/docker/matrix.{{inventory_hostname}}
      notify: Restart matrix

#    - name: run matrix.update
#      ansible.builtin.shell: bash /usr/local/sbin/autoupdate.d/matrix.update
#
#    - name: run matrix.init
#      ansible.builtin.shell: bash /home/docker/matrix.{{inventory_hostname}}/matrix.init.sh

    - name: Restart matrix
      ansible.builtin.shell: docker-compose up -d --force-recreate
      args:
        chdir: /home/docker/matrix.{{inventory_hostname}}

