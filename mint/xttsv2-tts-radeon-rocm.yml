---
# XTTS-v2 on the Radeon RX 7900 XTX: pin ROCm torch pair and TTS_DEVICE=cuda.
# Run after radeon-rocm.yml (ROCm runtime present) and xttsv2-tts-install.yml.
# ROCm torch is from https://download.pytorch.org/whl/rocm7.2 (torch/audio 2.11.0,
# the pair that matches gfx1100; newer torchaudio 2.12 crashes XTTS's STFT path).
- import_playbook: xttsv2-tts-install.yml

- name: XTTS-v2 switch to ROCm backend (GPU[1])
  hosts: compute.lan
  become: yes

  vars:
    xtts_user: llama
    xtts_venv: /opt/tts2/venv
    torch_ver: 2.11.0
    # Idle-exit: the process os._exit(0)s after this many s without a request
    # (a resident Coqui model spins GPU[1] at 100% gpu_busy_percent; only a
    # process exit releases the KFD context on gfx1100). Poll is short so the
    # GPU is freed promptly after the timeout.
    xtts_idle_timeout: 90
    xtts_idle_poll: 5

  tasks:
    - name: Stop XTTS-v2 before touching the venv
      ansible.builtin.systemd:
        name: xtts-v2
        state: stopped

    - name: Reinstall ROCm torch pair (rocm7.2 index)
      ansible.builtin.shell:
        cmd: "su -s /bin/bash {{ xtts_user }} -c 'PATH={{ xtts_venv }}/bin:$PATH python -m pip install --index-url https://download.pytorch.org/whl/rocm7.2 --force-reinstall torch=={{ torch_ver }}+rocm7.2 torchaudio=={{ torch_ver }}+rocm7.2'"
      register: tor
      changed_when: "'Successfully installed' in tor.stdout"

    - name: Write device env (ROCm, pinned to GPU[0])
      ansible.builtin.copy:
        dest: /etc/tts2/env
        owner: root
        group: root
        mode: "0644"
        content: |
          TTS_DEVICE=cuda
          LD_LIBRARY_PATH=/opt/rocm/lib
          HSA_ENABLE_SDMA=0
          # ROCr AsyncEventsLoop busy-poll spins ~1 core while the model is
          # resident (ROCm#6522, same as comfyui); HSA_TOOLS_DISABLE_REGISTER=1
          # stops it (kept in sync with comfyui-radeon-rocm.yml).
          HSA_TOOLS_DISABLE_REGISTER=1
          HIP_VISIBLE_DEVICES=0
          # XTTS runs on GPU[0] (2026-09-21): GPU[1] is nearly filled by the
          # llama-server KV cache, which leaves too little headroom and causes
          # stretched/repeated words in long batches; GPU[0] has ~9 GiB free.
          # ComfyUI is not in use while the TTS batch runs.
          PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
          # Coqui XTTS defaults: the aggressive anti-drift tuning from
          # 2026-09-14 (temp 0.5 / rep_penalty 4.0) sounded robotic and
          # artificial - reverted to the community-natural defaults. If
          # multilingual drift returns, raise repetition_penalty to 2.5
          # first (least quality impact), then lower temperature.
          TTS_TEMPERATURE=0.65
          TTS_TOP_K=50
          TTS_TOP_P=0.85
          TTS_LENGTH_PENALTY=1.0
          TTS_REPETITION_PENALTY=2.0
          # 650 chars/chunk ~= 365 tokens was far above the model's own German
          # limit (265... 253 chars, from tokenizer.char_limits): long passes
          # collapse the attention (repeated/stretched words), reproducible at
          # 45-53 s of a 1616-char request. 250 = XTTS' own "de" limit.
          TTS_CHUNK_CHARS=250
          # Idle-exit: model unloads + process exits after TTS_IDLE_TIMEOUT s
          # of no use; poll TTS_IDLE_POLL s so GPU[1] busy drops promptly.
          TTS_IDLE_TIMEOUT={{ xtts_idle_timeout }}
          TTS_IDLE_POLL={{ xtts_idle_poll }}

    - name: Create voice-cloning reference dir (/opt/tts2/refs/<name>.wav)
      ansible.builtin.file:
        path: /opt/tts2/refs
        state: directory
        owner: "{{ xtts_user }}"
        group: "{{ xtts_user }}"
        mode: "0755"
      tags: xtts-proxy

    - name: Remove manual systemd override (idle config now lives in /etc/tts2/env)
      ansible.builtin.file:
        path: /etc/systemd/system/xtts-v2.service.d/zz-idle.conf
        state: absent
      notify: Restart XTTS-v2

    - name: Start XTTS-v2 on ROCm/cuda
      ansible.builtin.systemd:
        name: xtts-v2
        state: restarted
        enabled: yes
        daemon_reload: yes

  handlers:
    - name: Restart XTTS-v2
      ansible.builtin.systemd:
        name: xtts-v2
        state: restarted
        daemon_reload: yes