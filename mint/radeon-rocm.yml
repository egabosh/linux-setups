---
- name: Install and update AMD ROCm
  hosts: all

  vars:
    amdgpu_repo_url: "https://repo.radeon.com/amdgpu-install/"
    # PINNED release (ROCm 7.2.4, driver 6.16): the ONLY stack proven stable for
    # multi-GPU llama.cpp on 2x 7900 XTX. ROCm 10.x userspace breaks multi-GPU
    # (hipMemcpyAsync segfault + SDMA engine hang) - tracked upstream as
    # https://github.com/ROCm/rocm-systems/issues/4817. Do NOT bump to "latest".
    # amdgpu_release_dir maps to driver 6.16.x; the deb name encodes ROCm 7.2.4.
    amdgpu_release_dir: "30.30.4"
    amdgpu_deb_name: "amdgpu-install_7.2.4.70204-1_all.deb"
    ansible_remote_tmp: /opt/tmp/ansible_$$

  tasks:
    # pre tasks
    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: yes
      tags: always
      changed_when: false

    - name: tmp-dir for following model downlaods,...
      file:
        path: "/opt/tmp"
        state: directory
        owner: root
        group: root
        mode: "1777"

    - name: Install base packages (curl, tar, zstd, ca-certificates, wget)
      ansible.builtin.apt:
        name:
          - curl
          - tar
          - zstd
          - ca-certificates
          - wget
          - libatomic1
          - libquadmath0
        state: present

    # AMDGPU + ROCm driver installation (pinned to ROCm 7.2.4)
    - name: Construct pinned amdgpu-install download URL (ROCm 7.2.4)
      ansible.builtin.set_fact:
        amdgpu_url: "{{ amdgpu_repo_url }}{{ amdgpu_release_dir }}/ubuntu/noble/{{ amdgpu_deb_name }}"

    - name: Download amdgpu-install.deb
      ansible.builtin.get_url:
        url: "{{ amdgpu_url }}"
        dest: "/opt/amdgpu-install.deb"
        mode: "0644"
        force: yes
      changed_when: false

    - name: Install/Update amdgpu-install package
      environment:
        DEBIAN_FRONTEND: noninteractive
      ansible.builtin.apt:
        deb: "/opt/amdgpu-install.deb"
        state: present
        update_cache: yes
      register: amdgpu_install

    - name: Run amdgpu-install with ROCm and graphics usecases
      environment:
        DEBIAN_FRONTEND: noninteractive
      ansible.builtin.command:
        # NOTE: the ROCm 7.2 installer has no --gfxversion flag (gfx1100 is in the
        # default target list). With --no-dkms the in-tree amdgpu driver is used,
        # which is the proven-good combination with the 7.2.4 userspace runtime.
        cmd: "amdgpu-install -y --usecase=rocm,graphics --no-dkms"
      when: amdgpu_install.changed

    # HIP/hipBLAS dev headers: NOT needed as a separate step on ROCm 7.2.
    # The 7.2 --usecase=rocm installs everything llama.cpp's GGML_HIP build needs
    # (hip_runtime.h, hipblas, rocblas) - verified on compute.lan (llama.cpp builds clean
    # against the 7.2.4 install). The amdrocm-*-dev10.x packages were only required
    # as a workaround for ROCm 10.x and are deliberately dropped here.

    - name: Check ROCm install dir location (ROCm 7.2 uses a versioned dir)
      ansible.builtin.shell: |
        if [ -d /opt/rocm ]; then echo /opt/rocm; \
        else ls -d /opt/rocm-* 2>/dev/null | sort -V | tail -n1; fi
      register: rocm_latest_dir
      changed_when: false
      failed_when: false

    - name: create /opt/rocm symlink (only if versioned dirs exist)
      ansible.builtin.file:
        src: "{{ rocm_latest_dir.stdout }}"
        dest: /opt/rocm
        state: link
        force: true
      when: rocm_latest_dir.stdout | length > 0 and rocm_latest_dir.stdout != '/opt/rocm'

    - name: Configure GPU access via udev rules
      ansible.builtin.copy:
        content: |
          KERNEL=="kfd", GROUP="render", MODE="0666"
          SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="render", MODE="0666"
        dest: /etc/udev/rules.d/70-amdgpu.rules
        owner: root
        group: root
        mode: "0644"
      notify: reload udev

    # Generic GPU / ROCm helper tools
    - name: Install generic GPU/ROCm helper packages
      ansible.builtin.apt:
        name:
          - pciutils
          - clinfo
          - radeontop
        state: present

  handlers:
    - name: reload udev
      ansible.builtin.command: udevadm control --reload-rules

