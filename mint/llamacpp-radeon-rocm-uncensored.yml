---
- name: Import shared llama.cpp base setup (build, user, dirs, API key, UFW)
  ansible.builtin.import_playbook: llamacpp-radeon-rocm-install.yml

- name: Setup & Update llama.cpp ROCm Server - Qwen3.8-27B Uncensored
  hosts: all

  environment:
    TMPDIR: /opt/tmp

  vars:
    llama_user: "llama"
    llama_dir: "/opt/llama.cpp"
    models_dir: "/opt/llama-models"
    server_port: 8080
    service_name: "llama-server"
    rocm_path: "/opt/rocm"

    # Qwen3.8-27B Uncensored Q5_K_M - 0bserverx Heretic abliteration (NON-GATED)
    # 27B dense, 262K native context, refusal-removed (0-6% vs 64-99% base)
    # Smartest readily-available quant that still fits BOTH GPUs (48 GiB) together with all other
    # services. Real file sizes: Q5_K_M 17.9 GiB + MTP head 1.7 + mmproj 0.6 + KV(q4_0 @256K) 12.6
    #   + overhead ~2 = ~34-35 GiB of 48 GiB. Worst-case single-GPU share ~17 GiB on GPU1; dynamic
    #   KV means typical usage (14-50K chats) uses only ~3-6 GiB KV -> realistic llama VRAM ~23-26 GiB.
    #   Fallback if parallel triple-peak OOMs: context 200704 (saves ~2.7 GiB) or Q4_K_M (saves ~2.5).
    # Q4_K_M also fits; Q6_K/Q8_0 do not fit alongside the other services.
    # Source: 0bserverx (non-gated alternative to gated orcarouter model)
    # Vision: preserved (mmproj Q8_0, bit-exact from base)
    # Reasoning: preserved (unlike 0xKitkat which locks thinking OFF)
    model_url: "https://huggingface.co/0bserverx/Qwen3.8-27B-Heretic-Abliterated-Uncensored-GGUF/resolve/main/RVN-Q5_K_M.gguf"
    model_file: "Qwen3.8-27B-Uncensored-Q5_K_M.gguf"
    # MTP (Multi-Token Prediction) draft head for speculative decoding (2-3x faster)
    # Use the SLIM standalone head mtp-RVN.gguf (1.7 GiB) - NOT the huge RVN-Q5_K_M-mtp.gguf
    #   (that one is the FULL model with an embedded head, would double VRAM as draft model).
    mtp_url: "https://huggingface.co/0bserverx/Qwen3.8-27B-Heretic-Abliterated-Uncensored-GGUF/resolve/main/mtp-RVN.gguf"
    mtp_file: "mtp-Qwen3.8-27B-Uncensored.gguf"
    # Vision projector (uncensored version, Q8_0)
    mmproj_file: "mmproj-Qwen3.8-27B-Uncensored-f16.gguf"
    mmproj_url: "https://huggingface.co/0bserverx/Qwen3.8-27B-Heretic-Abliterated-Uncensored-GGUF/resolve/main/mmproj-Qwen3.8-27B-Q8_0.gguf"

    # VRAM budget (48GB, 2x RX 7900 XTX, layers split): Q5_K_M 17.9 + MTP 1.7 + mmproj 0.6
    #   + KV(q4_0, ~48KB/token) + overhead. KV on GPU (no --no-kv-offload).
    # 256K (native max): 17.9+1.7+0.6+12.6+2 = ~34.8GB -> fits in 48GB; KV is dynamic, so typical
    #   usage is far below the 256K worst case. Quality/VRAM sweet spot for the full stack.
    context_length: 262144
    cache_type: "q4_0"
    # 2 parallel slots (one per user); slots share the unified KV pool up to context_length

    # Reasoning: preserved in orcarouter build (unlike 0xKitkat)
    # 1024 balances speed vs quality for general use
    reasoning_budget: 1024

    ansible_remote_tmp: /opt/tmp/ansible_$$

  tasks:
    - name: Check for existing GGUF model
      ansible.builtin.stat:
        path: "{{ models_dir }}/{{ model_file }}"
      register: model_stat

    - name: Download GGUF model (if not present)
      ansible.builtin.get_url:
        url: "{{ model_url }}"
        dest: "{{ models_dir }}/{{ model_file }}"
        mode: "0644"
        timeout: 7200
        force: no
      when: not model_stat.stat.exists

    - name: Check for existing MTP draft head
      ansible.builtin.stat:
        path: "{{ models_dir }}/{{ mtp_file }}"
      register: mtp_stat

    - name: Download MTP draft head (if not present)
      ansible.builtin.get_url:
        url: "{{ mtp_url }}"
        dest: "{{ models_dir }}/{{ mtp_file }}"
        mode: "0644"
        timeout: 3600
        force: no
      when: not mtp_stat.stat.exists

    - name: Check for existing Vision Projector
      ansible.builtin.stat:
        path: "{{ models_dir }}/{{ mmproj_file }}"
      register: mmproj_stat

    - name: Download Vision Projector (if not present)
      ansible.builtin.get_url:
        url: "{{ mmproj_url }}"
        dest: "{{ models_dir }}/{{ mmproj_file }}"
        mode: "0644"
        timeout: 7200
        force: no
      when: not mmproj_stat.stat.exists and mmproj_file | length > 0

    - name: Deploy systemd service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=llama.cpp ROCm Inference Server (Uncensored)
          After=network.target

          [Service]
          Type=simple
          User=llama
          Group=llama

          # ROCm environment
          Environment=HSA_ENABLE_SDMA=0
          Environment=HSA_OVERRIDE_GFX_VERSION=11.0.0
          # Use both GPUs (2x RX 7900 XTX = 48 GB VRAM); llama.cpp splits layers automatically
          Environment=LD_LIBRARY_PATH={{ rocm_path }}/lib:{{ rocm_path }}/lib64:/usr/lib/x86_64-linux-gnu
          Environment=PATH={{ rocm_path }}/bin:{{ rocm_path }}/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

          # API key auth: systemd loads the key file and expands it into ExecStart
          EnvironmentFile=/etc/llama-server/api-key

          # HIP/ROCm JIT needs read/write access to /tmp and /var/tmp
          PrivateTmp=false
          ProtectSystem=full
          ProtectHome=read-only

          # No restrictive privilege or device filters (often block HIP)
          NoNewPrivileges=no

          ExecStart=/opt/llama.cpp/build/bin/llama-server \
            -m {{ models_dir }}/{{ model_file }} \
            --spec-draft-model {{ models_dir }}/{{ mtp_file }} \
            --mmproj {{ models_dir }}/{{ mmproj_file }} \
            -c {{ context_length }} \
            -ngl 99 \
            --split-mode layer \
            -mg 0 \
            --kv-unified \
            -cram -1 \
            --cache-type-k {{ cache_type }} \
            --cache-type-v {{ cache_type }} \
            --flash-attn on \
            --jinja \
            --reasoning on \
            --reasoning-budget {{ reasoning_budget }} \
            --chat-template-kwargs '{"preserve_thinking": true}' \
            --spec-type draft-mtp \
            -ngld 99 \
            --n-predict 32768 \
            --temp 0.7 \
            --top-p 0.8 \
            --top-k 20 \
            --presence-penalty 1.5 \
            --repeat-penalty 1.0 \
            --api-key ${LLAMA_API_KEY} \
            --port {{ server_port }} \
            --host 0.0.0.0 \
             --parallel 2 \
            -b 1024 \
            -ub 512 \
            -lv 2

          Restart=on-failure
          RestartSec=10
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier={{ service_name }}

          ReadWritePaths=/opt/llama.cpp {{ models_dir }} /tmp /var/tmp

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/{{ service_name }}.service
        owner: root
        group: root
        mode: "0644"
      notify: restart service

    - name: Enable and start service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        enabled: yes
        state: started
        daemon_reload: yes

  handlers:
    - name: restart service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted
        daemon_reload: yes
