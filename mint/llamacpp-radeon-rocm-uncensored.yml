---
- name: Setup & Update llama.cpp ROCm Server - Qwen3.8-27B Uncensored
  hosts: all

  environment:
    TMPDIR: /opt/tmp

  vars:
    llama_user: "llama"
    llama_dir: "/opt/llama.cpp"
    models_dir: "/opt/llama-models"
    server_port: 8080
    service_name: "llama-server"
    rocm_path: "/opt/rocm"

    # Qwen3.8-27B Uncensored Q3_K_M - 0bserverx Heretic abliteration (NON-GATED)
    # 27B dense, 262K native context, refusal-removed (0-6% vs 64-99% base)
    # VRAM: 15.7GB model + 1.7GB MTP + 0.9GB mmproj + 0.5GB KV(q4_0@32K) + 2GB = ~20.8GB
    # Abliteration: Heretic (surgical, best capability retention) - same method as orcarouter
    # Source: 0bserverx (non-gated alternative to gated orcarouter model)
    # Vision: preserved (mmproj bit-exact from base)
    # Reasoning: preserved (unlike 0xKitkat which locks thinking OFF)
    model_url: "https://huggingface.co/0bserverx/Qwen3.8-27B-Heretic-Abliterated-Uncensored-GGUF/resolve/main/RVN-Q3_K_M.gguf"
    model_file: "Qwen3.8-27B-Uncensored-Q3_K_M.gguf"
    # MTP (Multi-Token Prediction) draft head for speculative decoding (2-3x faster)
    # Works with any Qwen3.8-27B quant (same architecture)
    mtp_url: "https://huggingface.co/ggml-org/Qwen3.8-27B-GGUF/resolve/main/mtp-Qwen3.8-27B-Q8_0.gguf"
    mtp_file: "mtp-Qwen3.8-27B-Q8_0.gguf"
    # Vision projector (uncensored version, Q8_0)
    mmproj_file: "mmproj-Qwen3.8-27B-Uncensored-f16.gguf"
    mmproj_url: "https://huggingface.co/0bserverx/Qwen3.8-27B-Heretic-Abliterated-Uncensored-GGUF/resolve/main/mmproj-Qwen3.8-27B-Q8_0.gguf"

    # VRAM budget (24GB): 15.7GB model + 1.7GB MTP + 0.9GB mmproj + KV(q4_0) + overhead
    # KV cache on GPU (no --no-kv-offload): ~48KB/token at q4_0
    # 128K: 15.7+1.7+0.9+6.3+2.0 = 26.6GB peak (vision+128K); text-only ~21.8GB - fits 24GB
    # 200K would OOM with KV on GPU (KV ~9.6GB -> ~26GB+); use coding.yml (KV on CPU) for 200K
    context_length: 131072
    cache_type: "q4_0"

    # Reasoning: preserved in orcarouter build (unlike 0xKitkat)
    # 1024 balances speed vs quality for general use
    reasoning_budget: 1024

    ansible_remote_tmp: /opt/tmp/ansible_$$

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install build dependencies
      ansible.builtin.apt:
        name:
          - build-essential
          - cmake
          - git
          - libcurl4-openssl-dev
          - libomp-dev
          - wget
          - curl
          - pkg-config
          - ufw
        state: present

    - name: Ensure user has ROCm device access
      ansible.builtin.user:
        name: "{{ llama_user }}"
        groups: video,render
        append: yes

    - name: Clone/Update llama.cpp repository
      ansible.builtin.git:
        repo: https://github.com/ggerganov/llama.cpp.git
        dest: "{{ llama_dir }}"
        version: master
        force: no
        update: yes
      changed_when: false

    - name: Check if llama-server binary exists
      ansible.builtin.stat:
        path: "{{ llama_dir }}/build/bin/llama-server"
      register: llama_binary

    - name: Rebuild llama.cpp with ROCm support
      ansible.builtin.shell: |
        rm -rf build/
        cmake -B build \
          -DGGML_HIP=ON \
          -DGGML_HIP_ROCWMMA_FATTN=ON \
          -DCMAKE_PREFIX_PATH={{ rocm_path }} \
          -DAMDGPU_TARGETS=gfx1100 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j$(nproc)
      args:
        chdir: "{{ llama_dir }}"
      environment:
        HIP_PATH: "{{ rocm_path }}"
        PATH: "{{ rocm_path }}/bin:{{ rocm_path }}/llvm/bin:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin', true) }}"
      register: build_result
      changed_when: build_result.rc == 0
      when: not llama_binary.stat.exists or force_rebuild | default(false)
      notify: restart service

    - name: Create llama directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ llama_dir }}"
        - "{{ models_dir }}"

    - name: Check for existing GGUF model
      ansible.builtin.stat:
        path: "{{ models_dir }}/{{ model_file }}"
      register: model_stat

    - name: Download GGUF model (if not present)
      ansible.builtin.get_url:
        url: "{{ model_url }}"
        dest: "{{ models_dir }}/{{ model_file }}"
        mode: "0644"
        timeout: 7200
        force: no
      when: not model_stat.stat.exists

    - name: Check for existing MTP draft head
      ansible.builtin.stat:
        path: "{{ models_dir }}/{{ mtp_file }}"
      register: mtp_stat

    - name: Download MTP draft head (if not present)
      ansible.builtin.get_url:
        url: "{{ mtp_url }}"
        dest: "{{ models_dir }}/{{ mtp_file }}"
        mode: "0644"
        timeout: 3600
        force: no
      when: not mtp_stat.stat.exists

    - name: Check for existing Vision Projector
      ansible.builtin.stat:
        path: "{{ models_dir }}/{{ mmproj_file }}"
      register: mmproj_stat

    - name: Download Vision Projector (if not present)
      ansible.builtin.get_url:
        url: "{{ mmproj_url }}"
        dest: "{{ models_dir }}/{{ mmproj_file }}"
        mode: "0644"
        timeout: 7200
        force: no
      when: not mmproj_stat.stat.exists and mmproj_file | length > 0

    - name: Deploy systemd service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=llama.cpp ROCm Inference Server (Uncensored)
          After=network.target

          [Service]
          Type=simple
          User=llama
          Group=llama

          # ROCm environment
          Environment=HSA_ENABLE_SDMA=0
          Environment=HSA_OVERRIDE_GFX_VERSION=11.0.0
          Environment=ROCR_VISIBLE_DEVICES=0
          Environment=HIP_VISIBLE_DEVICES=0
          Environment=LD_LIBRARY_PATH={{ rocm_path }}/lib:{{ rocm_path }}/lib64:/usr/lib/x86_64-linux-gnu
          Environment=PATH={{ rocm_path }}/bin:{{ rocm_path }}/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

          # HIP/ROCm JIT needs read/write access to /tmp and /var/tmp
          PrivateTmp=false
          ProtectSystem=full
          ProtectHome=read-only

          # No restrictive privilege or device filters (often block HIP)
          NoNewPrivileges=no

          ExecStart=/opt/llama.cpp/build/bin/llama-server \
            -m {{ models_dir }}/{{ model_file }} \
            --spec-draft-model {{ models_dir }}/{{ mtp_file }} \
            --mmproj {{ models_dir }}/{{ mmproj_file }} \
            -c {{ context_length }} \
            -ngl 99 \
            --kv-unified \
            -cram -1 \
            --cache-type-k {{ cache_type }} \
            --cache-type-v {{ cache_type }} \
            --flash-attn on \
            --jinja \
            --reasoning on \
            --reasoning-budget {{ reasoning_budget }} \
            --chat-template-kwargs '{"preserve_thinking": true}' \
            --spec-type draft-mtp \
            -ngld 99 \
            --n-predict 8192 \
            --temp 0.7 \
            --top-p 0.8 \
            --top-k 20 \
            --presence-penalty 1.5 \
            --repeat-penalty 1.0 \
            --port {{ server_port }} \
            --host 0.0.0.0 \
            --parallel 2 \
            -b 1024 \
            -ub 256 \
            -lv 2

          Restart=on-failure
          RestartSec=10
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier={{ service_name }}

          ReadWritePaths=/opt/llama.cpp {{ models_dir }} /tmp /var/tmp

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/{{ service_name }}.service
        owner: root
        group: root
        mode: "0644"
      notify: restart service

    - name: Enable and start service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Allow llama port through UFW
      community.general.ufw:
        rule: allow
        port: "{{ server_port }}"
        proto: tcp
      notify: reload ufw

  handlers:

    - name: reload ufw
      ansible.builtin.command: ufw reload

    - name: restart service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted
        daemon_reload: yes
