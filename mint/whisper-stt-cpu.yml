---
# Whisper.cpp CPU variant: shared base via import + CPU build + whisper-server service.
- name: Whisper.cpp with CPU backend
  ansible.builtin.import_playbook: whisper-stt-install.yml

- name: Whisper.cpp CPU backend
  hosts: all

  tasks:
    - name: Check for existing whisper-server binary
      ansible.builtin.stat:
        path: "{{ whisper_dir }}/build/bin/whisper-server"
      register: whisper_bin_st

    - name: Rebuild whisper.cpp for CPU (only when binary missing or force_rebuild)
      ansible.builtin.shell: |
        g_jobs=$(awk '/MemAvailable/ {printf "%d", $2/1024/1500}' /proc/meminfo)
        if [ -z "$g_jobs" ] || [ "$g_jobs" -lt 1 ]; then
          g_jobs=1
        fi
        if [ "$g_jobs" -gt "$(nproc)" ]; then
          g_jobs="$(nproc)"
        fi
        rm -rf build/
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j"${g_jobs}" --target whisper-server
      args:
        chdir: "{{ whisper_dir }}"
      register: build_result
      changed_when: build_result.rc == 0
      when: not whisper_bin_st.stat.exists or (force_rebuild | default(false) | bool)

    - name: Deploy whisper-server systemd service (CPU)
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=whisper.cpp CPU STT Server (Deutsch)
          After=network.target

          [Service]
          Type=simple
          User={{ whisper_user }}
          Group={{ whisper_user }}

          PrivateTmp=false
          ProtectSystem=full
          ProtectHome=read-only
          NoNewPrivileges=no

          ExecStart={{ whisper_dir }}/build/bin/whisper-server \
            -m {{ whisper_dir }}/models/{{ whisper_model }} \
            -l {{ whisper_lang }} \
            -t {{ ansible_processor_vcpus // 2 }} \
            --port {{ server_port }} \
            --host 0.0.0.0

          Restart=on-failure
          RestartSec=10
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=whisper-server

          ReadWritePaths={{ whisper_dir }} /tmp /var/tmp

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/whisper-server.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart whisper-server

    - name: Enable and start whisper-server service
      ansible.builtin.systemd:
        name: whisper-server
        enabled: yes
        state: started
        daemon_reload: yes

  handlers:
    - name: Restart whisper-server
      ansible.builtin.systemd:
        name: whisper-server
        state: restarted
        daemon_reload: yes