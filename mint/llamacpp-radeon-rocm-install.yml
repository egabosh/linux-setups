---
# Shared llama.cpp base: deps, user, repo, build, dirs, API key, firewall.
# Run standalone or imported by the model playbooks (llamacpp-radeon-rocm-*.yml).
- name: Install & build llama.cpp ROCm server base
  hosts: all

  environment:
    TMPDIR: /opt/tmp

  vars:
    llama_user: "llama"
    llama_dir: "/opt/llama.cpp"
    models_dir: "/opt/llama-models"
    server_port: 8080
    service_name: "llama-server"
    rocm_path: "/opt/rocm"
    ansible_remote_tmp: /opt/tmp/ansible_$$

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install build dependencies
      ansible.builtin.apt:
        name:
          - build-essential
          - cmake
          - git
          - libcurl4-openssl-dev
          - libomp-dev
          - wget
          - curl
          - pkg-config
          - pwgen
          - ufw
        state: present

    - name: Ensure user has ROCm device access
      ansible.builtin.user:
        name: "{{ llama_user }}"
        groups: video,render
        append: yes

    - name: Create llama directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ llama_dir }}"
        - "{{ models_dir }}"

    - name: Clone/Update llama.cpp repository
      ansible.builtin.git:
        repo: https://github.com/ggerganov/llama.cpp.git
        dest: "{{ llama_dir }}"
        version: master
        force: no
        update: yes
      changed_when: false

    - name: Check if llama-server binary exists
      ansible.builtin.stat:
        path: "{{ llama_dir }}/build/bin/llama-server"
      register: llama_binary

    # Build with RAM-aware parallelism: ~1.5 GB per parallel HIP compile job.
    # Prevents OOM on the 8 GB dev box; caps at nproc. Rebuilds only when the
    # binary is missing or force_rebuild=true (not on every git pull).
    - name: Rebuild llama.cpp with ROCm support
      ansible.builtin.shell: |
        rm -rf build/
        cmake -B build \
          -DGGML_HIP=ON \
          -DGGML_HIP_ROCWMMA_FATTN=ON \
          -DCMAKE_PREFIX_PATH={{ rocm_path }} \
          -DAMDGPU_TARGETS=gfx1100 \
          -DCMAKE_BUILD_TYPE=Release
        jobs=$(awk '/MemAvailable/ {printf "%d", $2/1024/1500; exit}' /proc/meminfo)
        jobs=$(( jobs < 1 ? 1 : jobs ))
        nproc=$(nproc)
        jobs=$(( jobs > nproc ? nproc : jobs ))
        cmake --build build -j${jobs}
      args:
        chdir: "{{ llama_dir }}"
      environment:
        HIP_PATH: "{{ rocm_path }}"
        PATH: "{{ rocm_path }}/bin:{{ rocm_path }}/llvm/bin:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin', true) }}"
      register: build_result
      changed_when: build_result.rc == 0
      when: not llama_binary.stat.exists or (force_rebuild | default(false) | bool)

    # API key auth: generated once on the server, referenced by clients (OpenWebUI, opencode)
    - name: Create llama API key directory
      ansible.builtin.file:
        path: /etc/llama-server
        state: directory
        owner: root
        group: "{{ llama_user }}"
        mode: "0750"

    # Generate a random API key once; persists across model switches so clients keep working
    - name: Generate llama API key (idempotent)
      ansible.builtin.shell: |
        [ -s /etc/llama-server/api-key ] || \
        printf 'LLAMA_API_KEY=%s\n' "$(pwgen -s 64)" > /etc/llama-server/api-key
      changed_when: false

    - name: Secure llama API key file
      ansible.builtin.file:
        path: /etc/llama-server/api-key
        owner: root
        group: "{{ llama_user }}"
        mode: "0640"

    - name: Allow llama port through UFW
      community.general.ufw:
        rule: allow
        port: "{{ server_port }}"
        proto: tcp
      notify: reload ufw

  handlers:
    - name: reload ufw
      ansible.builtin.command: ufw reload