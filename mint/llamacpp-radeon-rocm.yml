---
- name: Setup & Update llama.cpp ROCm Server with model
  hosts: all

  environment:
    TMPDIR: /opt/tmp

  vars:
    llama_user: "llama"
    llama_dir: "/opt/llama.cpp"
    models_dir: "/opt/llama-models"
    server_port: 8080
    service_name: "llama-server"
    rocm_path: "/opt/rocm"

    # Qwen3.6-35B-A3B uncensored heretic - MoE general (uncensored)
    model_file: "Qwen3.6-35B-A3B-uncensored-heretic-IQ4_NL.gguf"
    model_url: "https://huggingface.co/jorge-erdb/Qwen3.6-35B-A3B-uncensored-heretic-GGUF/resolve/main/{{ model_file }}"
    mmproj_file: "mmproj-Qwen3.6-35B-A3B-Q6_K.gguf"
    mmproj_url: "https://huggingface.co/batiai/Qwen3.6-35B-A3B-GGUF/resolve/main/{{ mmproj_file }}"
    context_length: 262144
    cache_type: "q4_0"
    ansible_remote_tmp: /opt/tmp/ansible_$$

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install build dependencies
      ansible.builtin.apt:
        name:
          - build-essential
          - cmake
          - git
          - libcurl4-openssl-dev
          - libomp-dev
          - wget
          - curl
          - pkg-config
          - pwgen
          - ufw
        state: present

    - name: Ensure user has ROCm device access
      ansible.builtin.user:
        name: "{{ llama_user }}"
        groups: video,render
        append: yes

    - name: Clone/Update llama.cpp repository
      ansible.builtin.git:
        repo: https://github.com/ggerganov/llama.cpp.git
        dest: "{{ llama_dir }}"
        version: master
        force: no
        update: yes
      changed_when: false

    - name: Check if llama-server binary exists
      ansible.builtin.stat:
        path: "{{ llama_dir }}/build/bin/llama-server"
      register: llama_binary

    - name: Rebuild llama.cpp with ROCm support
      ansible.builtin.shell: |
        rm -rf build/
        cmake -B build \
          -DGGML_HIP=ON \
          -DGGML_HIP_ROCWMMA_FATTN=ON \
          -DCMAKE_PREFIX_PATH={{ rocm_path }} \
          -DAMDGPU_TARGETS=gfx1100 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j$(nproc)
      args:
        chdir: "{{ llama_dir }}"
      environment:
        HIP_PATH: "{{ rocm_path }}"
        PATH: "{{ rocm_path }}/bin:{{ rocm_path }}/llvm/bin:{{ ansible_env.PATH | default('/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin', true) }}"
      register: build_result
      changed_when: build_result.rc == 0
      when: not llama_binary.stat.exists or force_rebuild | default(false)
      notify: restart service

    - name: Create llama directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ llama_dir }}"
        - "{{ models_dir }}"

    - name: Check for existing GGUF model
      ansible.builtin.stat:
        path: "{{ models_dir }}/{{ model_file }}"
      register: model_stat

    - name: Download GGUF model (if not present)
      ansible.builtin.get_url:
        url: "{{ model_url }}"
        dest: "{{ models_dir }}/{{ model_file }}"
        mode: "0644"
        timeout: 7200
        force: no
      when: not model_stat.stat.exists

    - name: Check for existing Vision Projector
      ansible.builtin.stat:
        path: "{{ models_dir }}/{{ mmproj_file }}"
      register: mmproj_stat

    - name: Download Vision Projector (if not present)
      ansible.builtin.get_url:
        url: "{{ mmproj_url }}"
        dest: "{{ models_dir }}/{{ mmproj_file }}"
        mode: "0644"
        timeout: 7200
        force: no
      when: not mmproj_stat.stat.exists

    # API key auth: generated once on the server, referenced by clients (OpenWebUI, opencode)
    - name: Create llama API key directory
      ansible.builtin.file:
        path: /etc/llama-server
        state: directory
        owner: root
        group: "{{ llama_user }}"
        mode: "0750"

    # Generate a random API key once; persists across model switches so clients keep working
    - name: Generate llama API key (idempotent)
      ansible.builtin.shell: |
        [ -s /etc/llama-server/api-key ] || \
        printf 'LLAMA_API_KEY=%s\n' "$(pwgen -s 64)" > /etc/llama-server/api-key
      changed_when: false

    - name: Secure llama API key file
      ansible.builtin.file:
        path: /etc/llama-server/api-key
        owner: root
        group: "{{ llama_user }}"
        mode: "0640"

    - name: Deploy systemd service file
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=llama.cpp ROCm Inference Server
          After=network.target

          [Service]
          Type=simple
          User=llama
          Group=llama

          # ROCm environment
          Environment=HSA_ENABLE_SDMA=0
          Environment=HSA_OVERRIDE_GFX_VERSION=11.0.0
          Environment=ROCR_VISIBLE_DEVICES=0
          Environment=HIP_VISIBLE_DEVICES=0
          Environment=LD_LIBRARY_PATH={{ rocm_path }}/lib:{{ rocm_path }}/lib64:/usr/lib/x86_64-linux-gnu
          Environment=PATH={{ rocm_path }}/bin:{{ rocm_path }}/llvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

          # API key auth: systemd loads the key file and expands it into ExecStart
          EnvironmentFile=/etc/llama-server/api-key

          # HIP/ROCm JIT needs read/write access to /tmp and /var/tmp
          PrivateTmp=false
          ProtectSystem=full
          ProtectHome=read-only

          # No restrictive privilege or device filters (often block HIP)
          NoNewPrivileges=no

          ExecStart=/opt/llama.cpp/build/bin/llama-server \
            -m {{ models_dir }}/{{ model_file }} \
            --mmproj {{ models_dir }}/{{ mmproj_file }} \
            -c {{ context_length }} \
            -ngl 99 \
            --no-kv-offload \
            --kv-unified \
            -cram -1 \
            --cache-type-k {{ cache_type }} \
            --cache-type-v {{ cache_type }} \
            --reasoning on \
            --n-predict 32768 \
            --reasoning-budget 4096 \
            --api-key ${LLAMA_API_KEY} \
            --port {{ server_port }} \
            --host 0.0.0.0 \
             --parallel 4 \
            -b 2048 \
            -ub 256 \
            -lv 2

          Restart=on-failure
          RestartSec=10
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier={{ service_name }}

          ReadWritePaths=/opt/llama.cpp {{ models_dir }} /tmp /var/tmp

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/{{ service_name }}.service
        owner: root
        group: root
        mode: "0644"
      notify: restart service

    - name: Enable and start service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Allow llama port through UFW
      community.general.ufw:
        rule: allow
        port: "{{ server_port }}"
        proto: tcp
      notify: reload ufw

  handlers:

    - name: reload ufw
      ansible.builtin.command: ufw reload

    - name: restart service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted
        daemon_reload: yes
