---
# Shared ComfyUI base: user, deps, clone, venv, model, workflow, UFW.
# Run standalone or imported by comfyui-cpu.yml / comfyui-radeon-rocm.yml.
- name: Install ComfyUI base (shared)
  hosts: all

  vars:
    comfyui_user: llama
    comfyui_dir: /opt/comfyui
    comfyui_port: 8188
    ansible_remote_tmp: /opt/tmp/ansible_$$

  environment:
    TMPDIR: /opt/tmp
    PIP_CACHE_DIR: /opt/.pip-cache

  tasks:
    - name: Expose shared ComfyUI facts to following plays (variants)
      ansible.builtin.set_fact:
        comfyui_user: "{{ comfyui_user }}"
        comfyui_dir: "{{ comfyui_dir }}"
        comfyui_port: "{{ comfyui_port }}"

    - name: Ensure /opt/tmp exists and is world-writable for remote_tmp
      ansible.builtin.file:
        path: /opt/tmp
        state: directory
        mode: "1777"

    - name: Ensure llama user exists
      ansible.builtin.user:
        name: "{{ comfyui_user }}"
        groups: video,render
        append: yes
        system: yes
        create_home: yes
        shell: /usr/sbin/nologin
      ignore_errors: yes

    - name: Install Python and build deps
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - python3-requests
          - git
          - libgl1
          - libglib2.0-0
          - ca-certificates
          - wget
        state: present
        update_cache: yes

    - name: Create ComfyUI base dir (owned by llama) so git clone can write into /opt
      ansible.builtin.file:
        path: "{{ comfyui_dir }}"
        state: directory
        owner: "{{ comfyui_user }}"
        group: "{{ comfyui_user }}"
        mode: "0755"

    - name: Clone ComfyUI repository
      ansible.builtin.git:
        repo: https://github.com/comfyanonymous/ComfyUI.git
        dest: "{{ comfyui_dir }}"
        version: master
        force: yes
        update: yes
      become: yes
      become_user: "{{ comfyui_user }}"

    - name: Create Python virtualenv
      ansible.builtin.command:
        cmd: python3 -m venv {{ comfyui_dir }}/venv
        creates: "{{ comfyui_dir }}/venv/bin/python"

    - name: Upgrade pip in venv
      ansible.builtin.pip:
        name: pip
        state: latest
        virtualenv: "{{ comfyui_dir }}/venv"
        virtualenv_python: python3

    - name: Create models dir
      ansible.builtin.file:
        path: "{{ comfyui_dir }}/models/checkpoints"
        state: directory
        mode: "0755"

    - name: Check for existing SD 1.5 model
      ansible.builtin.stat:
        path: "{{ comfyui_dir }}/models/checkpoints/sd15.safetensors"
      register: comfyui_model_stat

    - name: Download SD 1.5 model (only when not present)
      ansible.builtin.get_url:
        url: https://huggingface.co/runwayml/stable-diffusion-v1-5/resolve/main/v1-5-pruned.safetensors
        dest: "{{ comfyui_dir }}/models/checkpoints/sd15.safetensors"
        timeout: 120
        force: no
      when: not comfyui_model_stat.stat.exists

    - name: Deploy ComfyUI workflow (API format)
      ansible.builtin.copy:
        dest: "{{ comfyui_dir }}/workflow_api.json"
        owner: "{{ comfyui_user }}"
        group: "{{ comfyui_user }}"
        mode: "0644"
        content: |
          {
            "3": {
              "class_type": "KSampler",
              "inputs": {
                "cfg": 8.0,
                "denoise": 1.0,
                "latent_image": ["5", 0],
                "model": ["4", 0],
                "negative": ["6", 0],
                "positive": ["7", 0],
                "sampler_name": "euler",
                "scheduler": "normal",
                "seed": 42,
                "steps": 20
              }
            },
            "4": {
              "class_type": "CheckpointLoaderSimple",
              "inputs": {
                "ckpt_name": "sd15.safetensors"
              }
            },
            "5": {
              "class_type": "EmptyLatentImage",
              "inputs": {
                "batch_size": 1,
                "height": 512,
                "width": 512
              }
            },
            "6": {
              "class_type": "CLIPTextEncode",
              "inputs": {
                "clip": ["4", 1],
                "text": "NEGATIVE_PROMPT"
              }
            },
            "7": {
              "class_type": "CLIPTextEncode",
              "inputs": {
                "clip": ["4", 1],
                "text": "PROMPT"
              }
            },
            "8": {
              "class_type": "VAEDecode",
              "inputs": {
                "samples": ["3", 0],
                "vae": ["4", 2]
              }
            },
            "9": {
              "class_type": "SaveImage",
              "inputs": {
                "filename_prefix": "ComfyUI",
                "images": ["8", 0]
              }
            }
          }

    - name: Set ownership on ComfyUI directory
      ansible.builtin.file:
        path: "{{ comfyui_dir }}"
        owner: "{{ comfyui_user }}"
        group: "{{ comfyui_user }}"
        recurse: yes

    - name: Allow ComfyUI port {{ comfyui_port }} in UFW
      ansible.builtin.shell:
        cmd: ufw allow {{ comfyui_port }}/tcp
      changed_when: false