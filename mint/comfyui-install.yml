---
# Shared ComfyUI base: user, deps, clone, venv, model, workflow, UFW.
# Run standalone or imported by comfyui-cpu.yml / comfyui-radeon-rocm.yml.
- name: Install ComfyUI base (shared)
  hosts: all

  vars:
    comfyui_user: llama
    comfyui_dir: /opt/comfyui
    comfyui_port: 8188
    # Z-Image-Turbo (ComfyUI official template) model sources on HuggingFace
    comfyui_zimage_base: https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files
    ansible_remote_tmp: /opt/tmp/ansible_$$

  environment:
    TMPDIR: /opt/tmp
    PIP_CACHE_DIR: /opt/.pip-cache

  tasks:
    - name: Expose shared ComfyUI facts to following plays (variants)
      ansible.builtin.set_fact:
        comfyui_user: "{{ comfyui_user }}"
        comfyui_dir: "{{ comfyui_dir }}"
        comfyui_port: "{{ comfyui_port }}"

    - name: Ensure /opt/tmp exists and is world-writable for remote_tmp
      ansible.builtin.file:
        path: /opt/tmp
        state: directory
        mode: "1777"

    - name: Ensure llama user exists
      ansible.builtin.user:
        name: "{{ comfyui_user }}"
        groups: video,render
        append: yes
        system: yes
        create_home: yes
        shell: /usr/sbin/nologin
      ignore_errors: yes

    - name: Install Python and build deps
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - python3-requests
          - git
          - libgl1
          - libglib2.0-0
          - ca-certificates
          - wget
        state: present
        update_cache: yes

    - name: Create ComfyUI base dir (owned by llama) so git clone can write into /opt
      ansible.builtin.file:
        path: "{{ comfyui_dir }}"
        state: directory
        owner: "{{ comfyui_user }}"
        group: "{{ comfyui_user }}"
        mode: "0755"

    - name: Clone ComfyUI repository
      ansible.builtin.git:
        repo: https://github.com/comfyanonymous/ComfyUI.git
        dest: "{{ comfyui_dir }}"
        version: master
        force: yes
        update: yes
      become: yes
      become_user: "{{ comfyui_user }}"

    - name: Create Python virtualenv
      ansible.builtin.command:
        cmd: python3 -m venv {{ comfyui_dir }}/venv
        creates: "{{ comfyui_dir }}/venv/bin/python"

    - name: Upgrade pip in venv
      ansible.builtin.pip:
        name: pip
        state: latest
        virtualenv: "{{ comfyui_dir }}/venv"
        virtualenv_python: python3

    - name: Create models dir
      ansible.builtin.file:
        path: "{{ comfyui_dir }}/models/checkpoints"
        state: directory
        mode: "0755"

    - name: Check for existing SD 1.5 model
      ansible.builtin.stat:
        path: "{{ comfyui_dir }}/models/checkpoints/sd15.safetensors"
      register: comfyui_model_stat

    - name: Download SD 1.5 model (only when not present)
      ansible.builtin.get_url:
        url: https://huggingface.co/runwayml/stable-diffusion-v1-5/resolve/main/v1-5-pruned.safetensors
        dest: "{{ comfyui_dir }}/models/checkpoints/sd15.safetensors"
        timeout: 120
        force: no
      when: not comfyui_model_stat.stat.exists

    # Large model downloads (20+ GB) while llama-server holds ~25 GB RSS on a 32 GB
    # box caused global OOM -> amdgpu SMU/SDMA wedge -> hard freeze (2026-09-11).
    # The stack MUST be stopped during downloads (see AGENTS "Heavy install rule"),
    # and /tmp/no-suspend prevents the idle-suspend watcher from suspending mid-run.
    - name: Warn if GPU stack is running (large downloads risk OOM -> wedge)
      ansible.builtin.shell:
        cmd: systemctl is-active llama-server comfyui 2>/dev/null | grep -q active && echo RUNNING || echo IDLE
      changed_when: false
      register: comfyui_stack_state
      failed_when: false

    - name: Halt if GPU stack is running during model downloads
      ansible.builtin.fail:
        msg: "{{ comfyui_stack_state.stdout }} - stop llama-server/comfyui first (OOM -> amdgpu wedge), e.g. systemctl stop llama-server comfyui whisper-server whisper-openai-proxy xtts-v2"
      when: "comfyui_stack_state.stdout == 'RUNNING'"

    - name: Prevent idle-suspend during long downloads
      ansible.builtin.file:
        path: /tmp/no-suspend
        state: touch

    - name: Ensure Z-Image-Turbo model dirs exist
      ansible.builtin.file:
        path: "{{ comfyui_dir }}/models/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - text_encoders
        - diffusion_models
        - vae
      changed_when: false

    # Z-Image-Turbo (ComfyUI official template workflow, 6B, 8 steps, needs
    # qwen_3_4b text encoder + z_image_turbo_bf16 + ae VAE). wget -c resumes
    # interrupted downloads; each task skips when the file is already present.
    - name: Download Z-Image-Turbo text encoder (Qwen3-4B, 8 GB, resume-capable)
      ansible.builtin.shell:
        cmd: wget -c -q -O {{ comfyui_dir }}/models/text_encoders/qwen_3_4b.safetensors "{{ comfyui_zimage_base }}/text_encoders/qwen_3_4b.safetensors"
      args:
        creates: "{{ comfyui_dir }}/models/text_encoders/qwen_3_4b.safetensors"

    - name: Download Z-Image-Turbo diffusion model (12.3 GB, resume-capable)
      ansible.builtin.shell:
        cmd: wget -c -q -O {{ comfyui_dir }}/models/diffusion_models/z_image_turbo_bf16.safetensors "{{ comfyui_zimage_base }}/diffusion_models/z_image_turbo_bf16.safetensors"
      args:
        creates: "{{ comfyui_dir }}/models/diffusion_models/z_image_turbo_bf16.safetensors"

    - name: Download Z-Image-Turbo VAE (ae.safetensors, 0.3 GB, resume-capable)
      ansible.builtin.shell:
        cmd: wget -c -q -O {{ comfyui_dir }}/models/vae/ae.safetensors "{{ comfyui_zimage_base }}/vae/ae.safetensors"
      args:
        creates: "{{ comfyui_dir }}/models/vae/ae.safetensors"

    # Downloads are done: clear the suspend guard again.
    - name: Re-allow idle suspend after downloads
      ansible.builtin.file:
        path: /tmp/no-suspend
        state: absent

    - name: Deploy ComfyUI workflow (API format)
      ansible.builtin.copy:
        dest: "{{ comfyui_dir }}/workflow_api.json"
        owner: "{{ comfyui_user }}"
        group: "{{ comfyui_user }}"
        mode: "0644"
        content: |
          {
            "3": {
              "class_type": "KSampler",
              "inputs": {
                "cfg": 8.0,
                "denoise": 1.0,
                "latent_image": ["5", 0],
                "model": ["4", 0],
                "negative": ["6", 0],
                "positive": ["7", 0],
                "sampler_name": "euler",
                "scheduler": "normal",
                "seed": 42,
                "steps": 20
              }
            },
            "4": {
              "class_type": "CheckpointLoaderSimple",
              "inputs": {
                "ckpt_name": "sd15.safetensors"
              }
            },
            "5": {
              "class_type": "EmptyLatentImage",
              "inputs": {
                "batch_size": 1,
                "height": 512,
                "width": 512
              }
            },
            "6": {
              "class_type": "CLIPTextEncode",
              "inputs": {
                "clip": ["4", 1],
                "text": "NEGATIVE_PROMPT"
              }
            },
            "7": {
              "class_type": "CLIPTextEncode",
              "inputs": {
                "clip": ["4", 1],
                "text": "PROMPT"
              }
            },
            "8": {
              "class_type": "VAEDecode",
              "inputs": {
                "samples": ["3", 0],
                "vae": ["4", 2]
              }
            },
            "9": {
              "class_type": "SaveImage",
              "inputs": {
                "filename_prefix": "ComfyUI",
                "images": ["8", 0]
              }
            }
          }

    - name: Set ownership on ComfyUI directory
      ansible.builtin.file:
        path: "{{ comfyui_dir }}"
        owner: "{{ comfyui_user }}"
        group: "{{ comfyui_user }}"
        recurse: yes

    - name: Allow ComfyUI port {{ comfyui_port }} in UFW
      ansible.builtin.shell:
        cmd: ufw allow {{ comfyui_port }}/tcp
      changed_when: false